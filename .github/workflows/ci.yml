name: CI

on:
  push:
  pull_request:

jobs:
  lint-client:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
      
      - name: Lint client
        run: npm run lint

  lint-server:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint server
        run: npm run lint
  
  build-client:
    runs-on: ubuntu-latest
    needs:
      - lint-client
      - lint-server

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build


  build-server:
    runs-on: ubuntu-latest
    needs:
      - lint-client
      - lint-server

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build server
        run: npm run build

  test-server:
    runs-on: ubuntu-latest
    needs:
      - build-client
      - build-server

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_pw
          POSTGRES_DB: app_test_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U app -d app_test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: app
      PGPASSWORD: app_pw
      PGDATABASE: app_test_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Initialize database
        run: |
          psql \
            -h localhost \
            -U app \
            -d app_test_db \
            -f db/init/001-schema.sql

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run server tests
        working-directory: server
        run: npm test


  test-e2e:
    runs-on: ubuntu-latest
    needs:
      - test-server

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_pw
          POSTGRES_DB: app_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U app -d app_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: app
      PGPASSWORD: app_pw
      PGDATABASE: app_db
      E2E_BASE_URL: http://localhost:4173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Initialize database
        run: |
          psql \
            -h localhost \
            -U app \
            -d app_db \
            -f db/init/001-schema.sql

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Start server
        working-directory: server
        run: npm run start:ci &

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Start client
        working-directory: client
        run: npx vite preview --port 4173 --host &

      - name: Install Playwright browsers
        working-directory: client
        run: npx playwright install --with-deps

      - name: Wait for applications
        run: sleep 5

      - name: Run E2E tests
        working-directory: client
        run: npx playwright test